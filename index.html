<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Match</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="game">
        <header class="game__header">
            <div>
                <h1>Memory Match</h1>
                <p>Find all the matching pairs.</p>
            </div>
            <p class="moves">Moves: <span id="moves">0</span></p>
        </header>
    
        <p id="status" class="status" aria-live="polite">
            Choose any card to begin.
        </p>

        <section id="board" class="board" aria-label="Memory card board"></section>
    
        <button id="restart" class="restart" type="button">
            Restart game
        </button>
    </main>
</body>
</html>
